    // Envelope material and lifting gas. The gas comes from the craft's tanks (RealFuels ServiceModule
    // or Fuselage tanks hold compressed Helium and Hydrogen); on Earth's ground a ground crew fills it.
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = envelopeGasSwitch
        switcherDescription = Envelope / Lift Gas
        switcherDescriptionPlural = Envelope / Lift Gas Types

        SUBTYPE
        {
            name = HydrogenStandard
            title = Polyethylene, hydrogen
            descriptionDetail = NASA's standard 0.8 mil (20 micron) polyethylene, 18.7 g/m2. Vents gas as it rises instead of popping. For Earth and Mars. Tears in airflow over 400 Pa: 25 m/s at Earth's sea level, 44 m/s at 10 km, 93 m/s at 20 km, climbing included. Fails in air over 80 C, and it resists sulfuric acid only when cold: on Venus it survives the clouds above ~58 km (below 20 C), not deeper.
            addedCost = 0
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleRealBalloon
                }
                DATA
                {
                    liftGas = Hydrogen
                    volumeFactor = 1
                    filmDensity = 18.7    // g/m2 of film or fabric alone
                    designAirMolarMass = 0    // the home world's air
                    maxAirTemperature = 353    // K (80 C)
                    minPressure = 0.001    // vents rather than pops: works up to near vacuum
                    tearPressure = 400    // Pa of airflow dynamic pressure that tears it
                    acidMaxTemperature = 293    // K: polyethylene resists concentrated sulfuric acid cold (20 C), not warm (60 C)
                }
            }
        }
