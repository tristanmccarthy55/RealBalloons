// RealBalloons: the balloon part.
// Copyright (c) 2026 tristanmccarthy55, MIT. A rewritten derivative of KerBalloons (originally by JoePatrick1,
// maintained by linuxgurugamer); model, texture and sounds from KerBalloons (MIT).
// Physics in RealBalloons.dll (ModuleRealBalloon): a zero-pressure balloon (a blimp keeps its hull full with
// ballonets, which lifts by the same law). Each size holds a fixed amount
// of gas, set so hydrogen on Earth lifts off with maxLift / g tonnes (balloon included); it floats where
// the full envelope (envelopeVolume x volumeFactor) can just hold the craft up. The envelope material sets
// its film (filmDensity, g/m2), the air it's built for (designAirMolarMass) and its heat rating
// (maxAirTemperature). The plugin works out the envelope's mass from its film, surface and the load its gas
// fill lifts (film, caps and load tapes), fitted to NASA's 40 million cu ft standard balloon and its Big 60:
// sizes add no mass of their own. Size titles and descriptions give that envelope's numbers in RSS.
// The envelope tears when the airflow's dynamic pressure passes its tearPressure (Pa), and the VAB plans for any
// planet a balloon can float on (Plan for), with how fast the craft leaves the ground (Climb at launch).
//
// B9PartSwitch reloads the whole base ModuleRealBalloon block whenever a switcher changes subtype, so the
// fields each switcher sets are set in every one of its subtypes and nowhere else:
//     balloonSizeSwitch  -> maxLift, envelopeVolume
//     envelopeGasSwitch  -> liftGas, volumeFactor, filmDensity, designAirMolarMass, maxAirTemperature, minPressure, tearPressure, acidMaxTemperature

