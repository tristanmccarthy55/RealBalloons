            descriptionDetail = Teflon-coated fabric like the VEGA balloons at Venus in 1985: heavy (212 g/m2 like VEGA's, about the same as rubberized cotton), acid-proof and strong, in an envelope a fortieth the size, for dense air. Rated to 160 C: fails below ~40 km on Venus; inflate at or below where the load should float to put all the gas in. Tears at 6,000 Pa, 15 times polyethylene's: 47 m/s at 40 km on Venus, 98 m/s at 55 km or at Earth's sea level. On Earth it's a fast low-altitude airship hull: the gas fills it about 2 km up. Also works on Titan.
            addedCost = 1500
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleRealBalloon
                }
                DATA
                {
                    liftGas = Helium
                    volumeFactor = 0.02414
                    filmDensity = 212    // g/m2: Teflon-coated fabric (VEGA's ~276 g/m2 all-in with seams and fittings)
                    designAirMolarMass = 0.04345    // kg/mol, Venus air: tapes rated for the load there
                    maxAirTemperature = 433    // K (160 C)
                    minPressure = 0.001    // vents rather than pops: works up to near vacuum
                    tearPressure = 6000    // Pa of airflow dynamic pressure that tears it
                    acidMaxTemperature = 433    // acid-proof up to its heat rating (Teflon)
                }
            }
        }
        SUBTYPE
        {
            name = VenusHydrogen
            title = Teflon-coated fabric (Venus, airships), hydrogen
            upgradeRequired = RealBalloonVenus
            descriptionDetail = Teflon-coated fabric like the VEGA balloons at Venus in 1985: heavy (212 g/m2 like VEGA's, about the same as rubberized cotton), acid-proof and strong, in an envelope a fortieth the size, for dense air. Rated to 160 C: fails below ~40 km on Venus; inflate at or below where the load should float to put all the gas in. Hydrogen can't burn in CO2: lifts 5% more than helium, at half the fill weight. Tears at 6,000 Pa, 15 times polyethylene's: 47 m/s at 40 km on Venus, 98 m/s at 55 km or at Earth's sea level. On Earth it's a fast low-altitude airship hull: the gas fills it about 2 km up. Also works on Titan.
            addedCost = 1200
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleRealBalloon
                }
                DATA
                {
                    liftGas = Hydrogen
                    volumeFactor = 0.02414
                    filmDensity = 212    // g/m2: Teflon-coated fabric (VEGA's ~276 g/m2 all-in with seams and fittings)
                    designAirMolarMass = 0.04345    // kg/mol, Venus air: tapes rated for the load there
                    maxAirTemperature = 433    // K (160 C)
                    minPressure = 0.001    // vents rather than pops: works up to near vacuum
                    tearPressure = 6000    // Pa of airflow dynamic pressure that tears it
                    acidMaxTemperature = 433    // acid-proof up to its heat rating (Teflon)
                }
            }
        }
    }

    MODULE
    {
        name = ModuleRealBalloon
        keelTearAngle = 60    // degrees: a cushion tipped further than this is torn by its keel (rule of cool)
        envelopeTransform = Balloon
        ropeTransform = Rope
        capTransform = Cap
        liftPointTransform = liftPoint
        ropeEndTransform = balloonPoint
        inflateTime = 5         // s, the least: more for a bigger gas (inflateRate s per cube root of 1000 m3)
        inflateTimeMax = 45     // s
        inflateRate = 8         // s
        inflateHullRate = 12    // s, the same for a blimp's hull (it runs out as a rod, then swells)
        ventRate = 0.001        // gas valve open: of the fill a second
        ventSurplusRate = 0.01  // gas valve to neutral: of the fill a second
        ventFloor = 0.05        // the valve shuts at this share of the fill
        ventPulse = 0.005       // each "Vent 0.5%" action: of the craft's weight
        ripTime = 4             // s: the rip panel lets the gas out
        cushionShape = 0.65     // cushion envelope's height over its width (1 = round), same volume
        // Player options (mount, keel, blimp length) aren't set here: B9PartSwitch
        // reloads this block on every switch, which would reset them. Colour is TexturesUnlimited's (below).
    }

    MODULE
    {
        name = FlagDecal
        textureQuadName = flagDecal
    }

    EFFECTS
    {
        inflate
        {
            AUDIO
            {
                clip = RealBalloons/Sounds/inflate
                volume = 1
            }
        }
        deflate
        {
            AUDIO
            {
                clip = RealBalloons/Sounds/deflate
                volume = 1
            }
        }
        burst
        {
            AUDIO
            {
                clip = RealBalloons/Sounds/burst
                volume = 1
            }
        }
    }
}

