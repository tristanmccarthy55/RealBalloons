// ---- FAR ----
// FAR builds drag from the part's meshes and would pick up the inflated envelope whenever it
// re-voxelizes, on top of the module's own envelope drag. Keep it out.
@PART[RealBalloon]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
    @MODULE[GeometryPartModule]
    {
        ignoreTransform = Balloon
        ignoreTransform = flagDecal
        ignoreTransform = Rope
        ignoreTransform = RBCounterweight    // cushion keel weight (made in flight, outside the model)
        ignoreTransform = RBFins             // blimp fins (made in flight)
        ignoreTransform = RBCushionCollider  // cushion collider (made in flight)
        ignoreTransform = RBEvenFrame        // holds the envelope and rope in flight (no mesh of its own)
    }
}

// ---- Envelope colour: TexturesUnlimited ----
// The RO standard recolouring (ROLib needs TU, so RO / RP-1 installs normally have it; ROLib parts and
// Procedural Fairings recolour with it). In the part menu, "Envelope" picks a pattern and "Open Recoloring
// GUI" sets its colours, each with gloss and metal, from TU's palette or the balloon films below; it copies
// and pastes like any other TU part. Without TU the envelope is natural film and nothing else changes.
// TU's material goes on the envelope (Balloon) and the packed cap (Cap) only: not the flag, rope or base.
// The blimp fins share the envelope's material and sample it mid-gore (finTexel), always the main colour.
//
// The patterns are masks (R main, G second, B load tapes) made by Source/Tools/make_masks.py. The plugin
// unrolls the envelope at load: its texture runs once round the envelope (its 8 gore seams at every eighth)
// and from one end through the widest part to the other, evenly along it, both halves alike, so band edges
// run along texel rows and gore seams along columns and stay straight at any distance. The envelope has its
// own fabric texture for that (RealBalloons_Envelope: the KerBalloons fabric unrolled), and the masks are drawn
// on the same grid. The packed cap's disc is spread over a texture of its own (RealBalloons_Cap, its art from
// KBTexKerbin), and its capmask shows each pattern in miniature, so each set has a MATERIAL for each. TU keeps the
// fabric's
// seams and shading as the difference from _DiffuseNorm, each channel's average brightness over the
// envelope's surface (TU's luminance), so a colour comes out as picked. The first set is the default, and
// what craft from before the patterns get.
//
// Every set gives _BumpMap a flat normal map (TU's own fill). TU fills empty slots only in its "update"
// mode; in "create" mode an empty _BumpMap is Unity's "bump" default, whose alpha TU reads as the normal's
// X: lighting followed the UV tangents, which flip between the envelope's top and bottom halves (their UVs
// mirror), so the light changed abruptly at the equator.
@PART[RealBalloon]:HAS[!MODULE[KSPTextureSwitch]]:NEEDS[TexturesUnlimited]:FOR[RealBalloons]
{
    MODULE
    {
        name = KSPTextureSwitch
        sectionName = Envelope
        textureSet = RealBalloons_Film
        textureSet = RealBalloons_Tapes
        textureSet = RealBalloons_Gores
        textureSet = RealBalloons_Band
        textureSet = RealBalloons_Harlequin
    }
    MODULE
    {
        name = SSTURecolorGUI
    }
}

// Plain film, one colour: no mask (TU's default is all main colour).
KSP_TEXTURE_SET:NEEDS[TexturesUnlimited]
{
    name = RealBalloons_Film
    title = Natural film
    recolorable = true
    channelMask = 1        // one colour: the whole envelope
    featureMask = 7        // colour, gloss (specular) and metal
    MATERIAL    // the envelope: its own unrolled fabric and masks
    {
        mode = create
        shader = TU/Metallic
        mesh = Balloon
        keyword = TU_RECOLOR
        texture = _MainTex, RealBalloons/Parts/RealBalloon/RealBalloons_Envelope
        textureColor = _BumpMap, 128,128,128,128    // flat normals: see above
        vector = _DiffuseNorm, 0.928, 0.928, 0.928
    }
    MATERIAL    // the packed cap: its own texture, with the pattern in miniature
    {
        mode = create
        shader = TU/Metallic
        mesh = Cap
        keyword = TU_RECOLOR
        texture = _MainTex, RealBalloons/Parts/RealBalloon/RealBalloons_Cap
        textureColor = _BumpMap, 128,128,128,128    // flat normals: see above
        vector = _DiffuseNorm, 0.928, 0.928, 0.928
    }
    COLORS
    {
        mainColor = RealBalloons_Natural
        secondColor = RealBalloons_Natural
        detailColor = RealBalloons_Natural
    }
}

