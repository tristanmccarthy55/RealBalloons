    title = Aerostat Envelope
    manufacturer = RealBalloons
    description = An aerostat envelope: a zero-pressure balloon on its rope, or on the fixed mount a blimp (its ballonets keep the hull full; rudders and elevators on its tail fins steer it at speed) or a cushion under a floating base. Lifting model: each mole of gas lifts the air it displaces, less its own weight, the same while the envelope is slack; once the gas fills it (a blimp's pressure height) the surplus vents and lift falls with the air, so it floats where the air can just hold it up and heavier loads float lower. Gas from your tanks, or the ground crew on Earth. Envelopes: polyethylene, rubberized cotton (heavy, strong: early airships), thin-film polyethylene (lighter, for high altitude), Teflon-coated fabric (strong: Venus and fast airships). Sizes follow NASA's: Explorer II, 11.82 and 40 million cu ft, the Big 60. Airflow over its rating tears it, climbing included. In flight, a gas valve at its top lets gas out to come down. In the VAB, Plan for picks the planet, and Floats, Climb at launch and Balloon Info give its numbers there.
